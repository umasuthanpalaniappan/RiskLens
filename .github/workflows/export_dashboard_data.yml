name: Refresh web/data.json

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # CPU-only PyTorch (~200 MB); the default PyPI wheel pulls ~3 GB of CUDA
          # libraries and filled the runner disk ("No space left on device").
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Export web/data.json for the Vercel dashboard
        run: python scripts/export_dashboard_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain web/data.json)" ]; then
            git add web/data.json
            git commit -m "chore: refresh web/data.json"
            git push
          else
            echo "No changes in web/data.json, skipping commit."
          fi
