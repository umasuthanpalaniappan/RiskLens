name: Export raw (unadjusted) prices

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # CPU-only PyTorch (~200 MB); the default PyPI wheel pulls ~3 GB of CUDA
          # libraries and filled the runner disk ("No space left on device").
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Export raw unadjusted close prices
        run: python scripts/export_raw_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain dataset/prices_raw_unadjusted.csv)" ]; then
            git add dataset/prices_raw_unadjusted.csv
            git commit -m "chore: refresh raw unadjusted price export"
            git push
          else
            echo "No changes, skipping commit."
          fi
